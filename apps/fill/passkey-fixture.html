<!doctype html>
<meta charset="utf-8" />
<title>Veil passkey fixture</title>
<button id="register" type="button">Register</button>
<pre id="status">idle</pre>
<script>
  document.getElementById("register").addEventListener("click", function () {
    var status = document.getElementById("status");
    status.textContent = "pending";
    var challenge = new Uint8Array(32);
    crypto.getRandomValues(challenge);
    navigator.credentials
      .create({
        publicKey: {
          challenge: challenge,
          rp: { id: location.hostname, name: "Veil fixture" },
          user: { id: new Uint8Array([1, 2, 3, 4]), name: "ada", displayName: "Ada" },
          pubKeyCredParams: [{ type: "public-key", alg: -7 }],
        },
      })
      .then(function (cred) {
        status.textContent = cred && cred.id ? "ok " + cred.id : "err empty";
      })
      .catch(function (err) {
        status.textContent = "err " + (err && err.name ? err.name : "fail");
      });
  });
</script>
